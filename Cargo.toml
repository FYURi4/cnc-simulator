[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
wgpu = "27.0"
winit = "0.30"
bevy_ecs = "0.16"
glam = { version = "0.30", features = ["serde"] }
bytemuck = { version = "1.20", features = ["derive"] }
anyhow = "1.0"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"